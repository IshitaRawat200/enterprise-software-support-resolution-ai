[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-software-support-resolution-ai"
version = "0.1.0"
description = "Enterprise Software Support and Resolution Intelligence System"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",

    "sqlalchemy",
    "asyncpg",
    "psycopg",
    "pgvector",

    "bcrypt",
    "PyJWT",
    "email-validator",

    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-openai",
    "langchain-groq",

    "llama-index",
    "llama-index-core",
    "llama-index-retrievers-bm25",
    "llama-index-llms-groq",

    "pypdf",
    "beautifulsoup4",
    "lxml",

    "sentence-transformers",
    "einops",
    "groq",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]